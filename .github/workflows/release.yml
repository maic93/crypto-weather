name: Release

on:
  push:
    tags:
      - 'v*.*.*'   # triggers on v1.0.0, v1.2.3, etc.

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for release notes

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run backend tests
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pytest --no-header -q --no-cov

      - name: Run frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: notes
        run: |
          # Get commits since last tag
          PREV_TAG=$(git tag --sort=-creatordate | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" --no-merges | head -30)
          else
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --no-merges)
          fi

          cat >> $GITHUB_OUTPUT << NOTES
          BODY<<EOF
          ## ⛅ Crypto Weather ${{ steps.version.outputs.VERSION }}

          Real-time crypto market conditions with a 7-day outlook, weather-style confidence scoring, and accuracy tracking.

          ### Changes
          ${COMMITS}

          ### Quick Start
          \`\`\`bash
          git clone https://github.com/maic93/crypto-weather
          cd crypto-weather
          docker compose up --build
          \`\`\`

          App → http://localhost:3000 · API → http://localhost:8000/docs

          ### Test Results
          - ✅ Backend: 77 tests passing (90% coverage)
          - ✅ Frontend: 60 tests passing (93% coverage)
          EOF
          NOTES

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "⛅ Crypto Weather ${{ steps.version.outputs.VERSION }}"
          body: ${{ steps.notes.outputs.BODY }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}  # v1.0.0-beta = prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
